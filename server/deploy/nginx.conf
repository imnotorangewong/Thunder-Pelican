# /etc/nginx/sites-available/thunder-pelican
# 反代到本机的 node 服务（默认 127.0.0.1:8787），顺便做 TLS、压缩与限流。
# sites-enabled 里的文件是被 include 进 http{} 的，所以 limit_req_zone 写在文件顶部没问题。

limit_req_zone $binary_remote_addr zone=tp_read:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=tp_write:10m rate=30r/m;

upstream thunder_pelican {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name pelican.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pelican.example.com;

    ssl_certificate     /etc/letsencrypt/live/pelican.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pelican.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 单文件游戏 2.1 MB，成绩包（事件日志 + 速度轨迹）几十 KB
    client_max_body_size 2m;
    client_body_timeout 20s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 2048;

    access_log /var/log/nginx/thunder-pelican.access.log;
    error_log  /var/log/nginx/thunder-pelican.error.log warn;

    location /api/ {
        limit_req zone=tp_read burst=40 nodelay;
        proxy_pass http://thunder_pelican;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # 交成绩是写请求：单独一条更紧的限流，防止脚本刷榜
    location = /api/runs {
        limit_req zone=tp_write burst=5 nodelay;
        proxy_pass http://thunder_pelican;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location / {
        proxy_pass http://thunder_pelican;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
